name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci
      - run: npm test

  infra:
    runs-on: ubuntu-latest
    outputs:
      cloudfront_url: ${{ steps.outputs.outputs.cloudfront_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init

      - name: Preserve CloudFront API origin
        if: steps.filter.outputs.infra == 'true'
        run: |
          DIST_ID=$(terraform -chdir=infra/terraform output -raw cloudfront_distribution_id)
          API_ORIGIN=$(aws cloudfront get-distribution --id "$DIST_ID" \
            --query "Distribution.DistributionConfig.Origins.Items[?Id=='api'].DomainName | [0]" \
            --output text)
          if [[ -n "$API_ORIGIN" && "$API_ORIGIN" != "None" ]]; then
            echo "api_origin_domain = \"${API_ORIGIN}\"" > infra/terraform/api.auto.tfvars
          fi

      - name: Terraform apply
        if: steps.filter.outputs.infra == 'true'
        working-directory: infra/terraform
        run: terraform apply -auto-approve

      - name: Export Terraform outputs
        id: outputs
        run: |
          mkdir -p .deploy
          terraform -chdir=infra/terraform output -json > .deploy/terraform-outputs.json
          echo "cloudfront_url=$(jq -r '.cloudfront_url.value' .deploy/terraform-outputs.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs
          path: .deploy/terraform-outputs.json

  deploy:
    needs: [test, infra]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: terraform-outputs
          path: .deploy

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - uses: azure/setup-kubectl@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Deploy backend
        env:
          IMAGE_TAG: ${{ github.sha }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
        run: ./scripts/deploy-backend.sh

      - name: Deploy frontend
        env:
          VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ secrets.VITE_AUTH0_AUDIENCE }}
        run: ./scripts/deploy-frontend.sh

      - name: Deployment summary
        run: |
          CF_URL=$(jq -r '.cloudfront_url.value' .deploy/terraform-outputs.json)
          echo "### Deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **CloudFront URL:** ${CF_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image tag:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
